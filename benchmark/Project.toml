# Benchmarking environment for Remez.jl
#
# BenchmarkTools and ProfileView live here, not in the package's own
# Project.toml: as package dependencies they would drag Gtk4 (via ProfileView)
# into every install of Remez, for tooling that only this repo uses.
#
# Run from the repo root:
#   julia --project=benchmark -e 'using Pkg; Pkg.instantiate()'
#   julia --project=benchmark benchmark.jl

[deps]
BenchmarkTools = "6e4b80f9-dd63-53aa-95a3-0cdb28fa8baf"
ProfileView = "c46f51b8-102a-5cf2-8d2c-8597cb0e0da7"
Remez = "2e7db186-766a-50e7-8928-5c30181fb135"

[compat]
BenchmarkTools = "1.6.3"
ProfileView = "1.10.2"
julia = "1.10"

[sources]
# Point at the working tree rather than the registered Remez, which shares this
# UUID but is a different (upstream) package.
Remez = {path = ".."}